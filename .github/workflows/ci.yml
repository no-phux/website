name: ci

# Pull-request and main checks for the site. Deploys stay in site-deploy.yml
# and site-deploy-worker.yml. Docs and installers are read from no-phux/phux.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHUX_ROOT: ${{ github.workspace }}/phux
      # Browser acceptance intercepts WebSockets; never allocate a public session.
      PUBLIC_PHUX_DEMO_WS: wss://demo.invalid/session
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Per-file sitemap lastmod is each source file's own commit. A
          # depth-1 checkout would date every file with the tip, which the
          # generator rejects.
          fetch-depth: 0
          persist-credentials: false

      # The version/pin tests must inspect the source used to build the image,
      # not whichever release happens to be on product main during this run.
      - name: Resolve pinned native source
        id: phux-source
        run: |
          revision="$(sed -n 's/^ARG PHUX_REVISION=\([0-9a-f]\{40\}\)$/\1/p' worker/Dockerfile)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: no-phux/phux
          ref: ${{ steps.phux-source.outputs.revision }}
          path: phux
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish contract
        run: bash scripts/check-publish.sh

      - name: Native image pin
        run: python3 scripts/ci/site_source_pin.py --check

      - name: Native image pin tests
        run: python3 scripts/ci/test_site_source_pin.py

      - name: Test
        run: bun run test

      # Native-image tests above intentionally use their immutable source pin.
      # Documentation is a separate product: validate current phux main.
      - name: Check out current documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: no-phux/phux
          ref: main
          path: phux
          fetch-depth: 0
          persist-credentials: false

      - name: Build and verify current documentation
        run: |
          bun run build
          bun run check
          bun run check:links
          bun run verify:brand
          bun run verify:docs
          bun run verify:home
          bun run verify:live-layout
